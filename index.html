<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Familienorganisation</title>
<meta name="theme-color" content="#1f6f78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Familie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=7">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-top">
      <header class="famhead" id="famhead">
        <div class="eyebrow">Notizbuch &amp; Kalender</div>
        <h1 id="famTitle">Familienorganisation</h1>
        <div class="fam" id="famMembers"></div>
        <button class="iconbtn menuclose menubtn" id="closeSide" aria-label="Seitenleiste schließen">✕</button>
      </header>
      <input class="search" id="search" type="search" placeholder="In allen Notizen suchen" autocomplete="off">
      <div class="nbrow">
        <select class="nbsel" id="nbsel" aria-label="Notizbuch wählen"></select>
        <button class="iconbtn" id="nbmore" aria-label="Notizbuch-Menü">⋯</button>
      </div>
    </div>
    <div id="navArea" class="cols">
      <div>
        <div class="label">Abschnitte <button id="addSec">+ Abschnitt</button></div>
        <ul class="list secs" id="secs"></ul>
      </div>
      <div style="display:flex;flex-direction:column;min-height:0">
        <div class="label">Seiten <button id="addPage">+ Seite</button></div>
        <ul class="list pagelist" id="pages" style="flex:1"></ul>
      </div>
    </div>
    <div id="resultsArea" class="cols" hidden>
      <div class="label">Suchergebnisse</div>
      <ul class="list results" id="results"></ul>
    </div>
    <div class="status" id="status"><span class="led"></span><span id="statusTxt">Nur auf diesem Gerät</span></div>
    <div class="side-foot">
      <div class="account" id="account"></div>
      <button id="exportBtn">Sicherung erstellen</button>
      <button id="importBtn">Sicherung laden</button>
    </div>
  </aside>

  <main class="main">
    <div class="tools" id="tools">
      <button class="tbtn menubtn" id="openSide" aria-label="Seitenleiste öffnen"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <span class="mobtitle" id="mobTitle">Familienorganisation</span>
      <button class="tbtn on" data-tool="text" title="Text und Auswählen"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M9 19h6"/></svg><span class="l">Text</span></button>
      <button class="tbtn" data-tool="pen" title="Stift"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><span class="l">Stift</span></button>
      <button class="tbtn" data-tool="marker" title="Textmarker"><svg viewBox="0 0 24 24"><path d="M9 15l-4 4h6l1-1"/><path d="M9 15l7-11 4 3-7 11z"/></svg><span class="l">Marker</span></button>
      <button class="tbtn" data-tool="eraser" title="Radierer"><svg viewBox="0 0 24 24"><path d="M8 20h12M4 15l9-9 6 6-7 7H8z"/></svg><span class="l">Radierer</span></button>
      <span class="sep"></span>
      <span id="swatches"></span>
      <input class="size" id="size" type="range" min="1" max="12" value="3" aria-label="Strichstärke">
      <span class="sep"></span>
      <button class="tbtn fmt" data-cmd="bold" title="Fett"><b>F</b></button>
      <button class="tbtn fmt" data-cmd="italic" title="Kursiv"><i>K</i></button>
      <button class="tbtn fmt" data-cmd="underline" title="Unterstrichen"><u>U</u></button>
      <button class="tbtn fmt" data-cmd="h2" title="Überschrift">Ü</button>
      <button class="tbtn fmt" data-cmd="ul" title="Aufzählung"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
      <button class="tbtn fmt" data-cmd="todo" title="Aufgabe zum Abhaken"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg></button>
      <span class="sep"></span>
      <button class="tbtn" id="imgBtn" title="Bild einfügen"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><span class="l">Bild</span></button>
      <button class="tbtn" id="bgBtn" title="Papier: liniert, kariert, leer"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 12h16M4 16h16"/></svg></button>
      <button class="tbtn" id="undoBtn" title="Letzten Strich rückgängig"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="tbtn" id="calendarBtn" title="Gemeinsamer Kalender"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="l">Kalender</span></button>
      <button class="tbtn" id="calcBtn" title="Wissenschaftlicher Taschenrechner"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h1M15 11h1M8 14h2M12 14h1M15 14h1M8 17h2M12 17h1M15 17h1"/></svg><span class="l">Rechner</span></button>
      <button class="tbtn" id="pdfBtn" title="Seite als PDF speichern oder drucken"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg><span class="l">PDF</span></button>
      <input type="file" id="imgFile" accept="image/*" hidden>
      <input type="file" id="jsonFile" accept=".json,application/json,text/plain" hidden>
    </div>
    <div class="pagewrap" id="wrap">
      <div class="titlebar">
        <input class="ptitle" id="ptitle" placeholder="Seitentitel" aria-label="Seitentitel">
        <div class="pmeta" id="pmeta"></div>
      </div>
      <div class="sheet" id="sheet">
        <canvas class="ink" id="ink"></canvas>
      </div>
    </div>
  </main>
</div>

<script src="config.js?v=7"></script>
<script src="vendor/msal-browser.min.js?v=7"></script>
<script src="vendor/qrcode.js?v=7"></script>
<script src="js/db.js?v=7"></script>
<script src="js/onedrive.js?v=7"></script>
<script src="js/calc.js?v=7"></script>
<script src="js/calendar.js?v=7"></script>
<script src="js/app.js?v=7"></script>
</body>
</html>
